name: Build road-register HWPX report

on:
  workflow_dispatch:
  push:
    paths:
      - "hwpx-report/road_register_plan_review.md"
      - ".github/workflows/build_hwpx_report.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get HWPX generation skill
        run: git clone --depth 1 https://github.com/jkf87/hwpx-skill.git .hwpx-skill

      - name: Install dependencies
        run: python -m pip install --upgrade pip lxml python-hwpx

      - name: Prepare government-report markdown
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path("hwpx-report/road_register_plan_review.md")
          dst = Path("build/road_register_report.md")
          dst.parent.mkdir(parents=True, exist_ok=True)
          text = src.read_text(encoding="utf-8")

          if text.startswith("---\n"):
              end = text.find("\n---\n", 4)
              if end >= 0:
                  text = text[end + 5:]

          text = "\n".join(
              line for line in text.splitlines()
              if line.strip() != "---"
          )
          text = text.replace("++", "")

          title = "도로대장 통합관리체계 상세설계 고도화\n사업수행계획서 분석·검토 보고"
          text = re.sub(
              r"^#\s+도로대장 통합관리체계 상세설계 고도화 사업수행계획서 분석·검토 보고\s*",
              "# " + title + "\n\n> 본 구축사업의 설계·발주 완결성 확보를 위한 검토\n> 2026. 9. 1.  한국국토정보공사 디지털SOC처\n\n",
              text,
              count=1,
          )
          dst.write_text(text.strip() + "\n", encoding="utf-8")
          print(f"Prepared {dst} ({dst.stat().st_size} bytes)")

      - name: Generate editable HWPX
        run: |
          mkdir -p build/output
          python .hwpx-skill/scripts/md2hwpx.py \
            build/road_register_report.md \
            --output "build/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx" \
            --template report \
            --theme 남색 \
            --title "도로대장 통합관리체계 상세설계 고도화 사업수행계획서 분석·검토 보고" \
            --creator "한국국토정보공사 디지털SOC처"

      - name: Apply page breaks and refresh preview text
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZIP_STORED
          from lxml import etree
          import tempfile
          import os

          path = Path("build/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx")
          ns = {"hp": "http://www.hancom.co.kr/hwpml/2011/paragraph"}
          targets = {
              "검토 개요",
              "붙임 1. 분야별 세부 검토",
              "붙임 1-2. 분야별 세부 검토",
              "붙임 2. 통합 품질게이트 개선안",
              "붙임 3. 착수승인 보완자료",
              "붙임 4. 실증·품질 수용기준",
              "붙임 5. 주요 위험 및 관리방안",
          }

          with ZipFile(path, "r") as zin:
              entries = [(i, zin.read(i.filename)) for i in zin.infolist()]

          updated = []
          pagebreaks = 0
          preview_text = None
          for info, data in entries:
              if info.filename == "Contents/section0.xml":
                  root = etree.fromstring(data)
                  for p in root.xpath(".//hp:p", namespaces=ns):
                      txt = "".join(p.xpath(".//hp:t//text()", namespaces=ns)).strip()
                      if txt in targets:
                          p.set("pageBreak", "1")
                          pagebreaks += 1
                  data = etree.tostring(root, xml_declaration=True, encoding="UTF-8", standalone=None)
                  texts = root.xpath(".//hp:t//text()", namespaces=ns)
                  preview_text = "\n".join(t for t in texts if t and t.strip()).encode("utf-8")
              updated.append((info, data))

          if preview_text is not None:
              updated = [
                  (info, preview_text if info.filename == "Preview/PrvText.txt" else data)
                  for info, data in updated
              ]

          fd, tmpname = tempfile.mkstemp(suffix=".hwpx")
          os.close(fd)
          try:
              with ZipFile(tmpname, "w", ZIP_DEFLATED) as zout:
                  mime = next((x for x in updated if x[0].filename == "mimetype"), None)
                  if mime:
                      zout.writestr(mime[0], mime[1], compress_type=ZIP_STORED)
                  for info, data in updated:
                      if info.filename == "mimetype":
                          continue
                      zout.writestr(info, data, compress_type=ZIP_DEFLATED)
              Path(tmpname).replace(path)
          finally:
              if Path(tmpname).exists():
                  Path(tmpname).unlink()

          print(f"Applied {pagebreaks} page breaks")

      - name: Validate HWPX structure and extract text
        run: |
          python .hwpx-skill/scripts/fix_namespaces.py "build/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx"
          python .hwpx-skill/scripts/validate.py "build/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx" --layout
          python .hwpx-skill/scripts/text_extract.py "build/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx" > build/output/검증용_추출텍스트.txt
          test -s "build/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx"
          test -s build/output/검증용_추출텍스트.txt

      - name: Publish generated HWPX for transfer
        run: |
          mkdir -p hwpx-report/output
          cp "build/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx" \
             "hwpx-report/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hwpx-report/output/
          git diff --cached --quiet || git commit -m "build: generate validated HWPX report"
          git push

      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: road-register-hwpx-report
          path: build/output/
          if-no-files-found: error
          retention-days: 7
