name: Test direct HWPX artifact archive

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/artifact_as_hwpx.yml"

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the validated HWPX as artifact root
        run: |
          SRC="hwpx-report/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx"
          test -s "$SRC"
          mkdir -p direct_hwpx_root
          unzip -q "$SRC" -d direct_hwpx_root
          test "$(cat direct_hwpx_root/mimetype)" = "application/hwp+zip"
      - name: Upload HWPX internals as the artifact archive itself
        uses: actions/upload-artifact@v4
        with:
          name: direct-hwpx-archive
          path: |
            direct_hwpx_root/mimetype
            direct_hwpx_root/Contents
            direct_hwpx_root/META-INF
            direct_hwpx_root/Preview
            direct_hwpx_root/version.xml
            direct_hwpx_root/settings.xml
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Download artifact archive and validate it directly as HWPX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/jkf87/hwpx-skill.git .hwpx-validator
          python -m pip install --quiet lxml
          for i in {1..10}; do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="direct-hwpx-archive") | .id' 2>/dev/null || true)
            [ -n "$ID" ] && break
            sleep 2
          done
          test -n "$ID"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > direct_candidate.hwpx
          unzip -lv direct_candidate.hwpx | head -20
          python .hwpx-validator/scripts/validate.py direct_candidate.hwpx
