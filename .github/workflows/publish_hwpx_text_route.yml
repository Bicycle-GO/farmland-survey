name: Publish HWPX text-route copy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish_hwpx_text_route.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create byte-identical text-route copy
        run: |
          SRC="hwpx-report/output/도로대장_통합관리체계_상세설계_고도화_사업수행계획서_분석검토보고.hwpx"
          DST="hwpx-report/output/road_register_report_binary.txt"
          test -s "$SRC"
          cp "$SRC" "$DST"
          cmp "$SRC" "$DST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DST"
          git diff --cached --quiet || git commit -m "build: add byte-identical HWPX transfer copy"
          git push
